name: Windows

on:
  schedule:
    - cron: '10 5 * * *'
  push:
    branches: [ release, develop ]
  pull_request:
    branches-ignore: [ develop ]

jobs:
  Windows:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC C++17 x64 Debug
            cpp_version: 17
            build_type: Debug
            arch: x64
            toolset_args: ''
          - name: MSVC C++20 x64 Release
            cpp_version: 20
            build_type: Release
            arch: x64
            toolset_args: ''
          - name: MSVC C++23 x64 Release
            cpp_version: 23
            build_type: Release
            arch: x64
            toolset_args: ''
          - name: MSVC C++23 Win32 Debug
            cpp_version: 23
            build_type: Debug
            arch: Win32
            toolset_args: ''
          - name: ClangCL C++23 x64 Release
            cpp_version: 23
            build_type: Release
            arch: x64
            toolset_args: -T ClangCL
    runs-on: windows-latest
    name: ${{ matrix.name }}
    env:
      DAW_BUILD_DIR: build_${{ matrix.cpp_version }}_${{ matrix.arch }}_${{ matrix.build_type }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: >-
          cmake
          -S .
          -B ${{ env.DAW_BUILD_DIR }}
          -G "Visual Studio 18 2026"
          -A ${{ matrix.arch }}
          ${{ matrix.toolset_args }}
          -DCMAKE_CXX_STANDARD=${{ matrix.cpp_version }}
          -DDAW_NUM_RUNS=1
          -DDAW_ENABLE_TESTING=ON
          -DDAW_WERROR=ON
      - name: Build
        run: >-
          cmake
          --build ${{ env.DAW_BUILD_DIR }}
          --target ci_tests
          --config ${{ matrix.build_type }}
      - name: Test
        run: >-
          ctest
          --test-dir ${{ env.DAW_BUILD_DIR }}
          -C ${{ matrix.build_type }}
          -j2
          -VV
          --timeout 1200
