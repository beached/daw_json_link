name: Ubuntu

on:
  schedule:
    - cron: '5 5 * * *'
  push:
    branches: [ release, develop ]
  pull_request:
    branches-ignore: [ develop ]

jobs:
  CI_Tests:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 12 C++17 Debug
            os: ubuntu-24.04
            cc: gcc-12
            cxx: g++-12
            cpp_version: 17
            build_type: Debug
            exceptions: ON
            sanitizers: OFF
            reflection: OFF
            cxx_flags: ''
          - name: Clang 16 C++17 Release
            os: ubuntu-24.04
            cc: clang-16
            cxx: clang++-16
            cpp_version: 17
            build_type: Release
            exceptions: ON
            sanitizers: OFF
            reflection: OFF
            cxx_flags: ''
          - name: GCC 14 C++20 Release no exceptions
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            cpp_version: 20
            build_type: Release
            exceptions: OFF
            sanitizers: OFF
            reflection: OFF
            cxx_flags: ''
          - name: Clang 18 C++20 Debug sanitizers
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            cpp_version: 20
            build_type: Debug
            exceptions: ON
            sanitizers: ON
            reflection: OFF
            cxx_flags: ''
          - name: GCC 14 C++23 Release
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            cpp_version: 23
            build_type: Release
            exceptions: ON
            sanitizers: OFF
            reflection: OFF
            cxx_flags: ''
          - name: Clang 18 C++23 Release
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            cpp_version: 23
            build_type: Release
            exceptions: ON
            sanitizers: OFF
            reflection: OFF
            cxx_flags: ''
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CXXFLAGS: ${{ matrix.cxx_flags }}
      UBSAN_OPTIONS: halt_on_errors=1
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: >-
          cmake -G Ninja
          -S .
          -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_STANDARD=${{ matrix.cpp_version }}
          -DDAW_NUM_RUNS=1
          -DDAW_ENABLE_TESTING=ON
          -DDAW_NO_FLATTEN=ON
          -DDAW_USE_EXCEPTIONS=${{ matrix.exceptions }}
          -DDAW_JSON_USE_SANITIZERS=${{ matrix.sanitizers }}
          -DDAW_JSON_USE_REFLECTION=${{ matrix.reflection }}
      - name: Build
        run: cmake --build build --target ci_tests -- -k 0
      - name: Test
        run: ctest -C ${{ matrix.build_type }} -j2 -VV --timeout 1200 --test-dir build
